name: deploy-dev

# Despliega el frontend al entorno de desarrollo al mergear a `develop`.
# Regenera el `.env` del servidor desde los secretos del environment
# `desarrollo` y luego ejecuta el script de deploy (versionado en el repo
# `infra`). Para agregar una variable nueva: crea el secret y añade una línea
# en el bloque de abajo.
#
# El `.env` solo lleva `BACKEND_INTERNAL_URL`, que es una variable **de
# servidor**: la consume el proxy de Next.js (`src/app/api/v1/[...path]/route.ts`)
# y nunca se compila en el bundle del navegador. Por eso el navegador nunca ve
# la dirección del backend.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar frontend en desarrollo
    runs-on: ubuntu-latest
    environment: desarrollo
    # Un push hecho por el propio bot no debe re-disparar el deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.pusher.name != 'github-actions[bot]'
    steps:
      - name: Instalar llave SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_PASSPHRASE: ${{ secrets.DEPLOY_SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          # El agente SSH se creo en el paso anterior, en otro shell: hay que
          # volver a cargarlo aqui para que `ssh` pueda usar la llave cifrada.
          if [ -f ~/.ssh/agent_env ]; then
            . ~/.ssh/agent_env
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
          fi

          if [ -z "${DEPLOY_SSH_KEY:-}" ] || [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_PORT:-}" ]; then
            echo "::error::Faltan secrets de despliegue (DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_PORT) en el environment 'desarrollo'."
            exit 1
          fi

          mkdir -p ~/.ssh
          # La llave es PEM y puede traer CRLF: se normaliza a LF.
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # La llave tiene passphrase y el runner no es interactivo, asi que
          # ssh-add necesita un askpass que se la entregue.
          #
          # El agente y el askpass se dejan en ~/.ssh porque **cada paso del
          # workflow corre en un shell nuevo**: lo que se exporta aqui no llega
          # al paso siguiente. Los pasos que usan `ssh` vuelven a cargarlos con
          # `. ~/.ssh/agent_env`.
          if [ -n "${DEPLOY_SSH_KEY_PASSPHRASE:-}" ]; then
            printf '%s\n' "$DEPLOY_SSH_KEY_PASSPHRASE" > ~/.ssh/deploy_passphrase
            chmod 600 ~/.ssh/deploy_passphrase
            printf '%s\n' '#!/usr/bin/env bash' 'cat ~/.ssh/deploy_passphrase' > ~/.ssh/askpass.sh
            chmod 700 ~/.ssh/askpass.sh
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
            # ssh-agent -s imprime tambien un "echo Agent pid ..." que no es un
            # comando valido como script: se filtran solo los export.
            ssh-agent -s | grep '^SSH_AUTH_SOCK\|^SSH_AGENT_PID' > ~/.ssh/agent_env
            . ~/.ssh/agent_env
            if ! ssh-add ~/.ssh/deploy_key; then
              echo "::error::No se pudo cargar la llave en el agente SSH. Revisa DEPLOY_SSH_KEY_PASSPHRASE."
              exit 1
            fi
            echo "Llave cargada en el agente SSH."
          fi

          # La clave del host se fija por fingerprint: no se acepta la primera
          # conexion a ciegas. Si el host cambia, hay que actualizar el secret.
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > /tmp/host_keys 2>&1 || true
          if [ ! -s /tmp/host_keys ]; then
            echo "::error::No se pudo obtener la clave del host $DEPLOY_HOST:$DEPLOY_PORT."
            echo "::error::Detalle del escaneo:"
            cat /tmp/host_keys
            exit 1
          fi
          cat /tmp/host_keys >> ~/.ssh/known_hosts

      - name: Reportar el deployment como 'in progress'
        id: deployment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: 'desarrollo',
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              payload: { deployed_at: new Date().toISOString() },
            });
            core.setOutput('deployment_id', data.id);
            core.setOutput('deployment_url', data.url);
            core.info(`Deployment ${data.id} creado`);

      - name: Regenerar .env del frontend en el servidor
        env:
          BACKEND_INTERNAL_URL: ${{ secrets.BACKEND_INTERNAL_URL }}
        run: |
          set -euo pipefail
          # El agente SSH se creo en el paso anterior, en otro shell: hay que
          # volver a cargarlo aqui para que `ssh` pueda usar la llave cifrada.
          if [ -f ~/.ssh/agent_env ]; then
            . ~/.ssh/agent_env
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
          fi
          if [ -z "${BACKEND_INTERNAL_URL:-}" ]; then
            echo "::error::Falta BACKEND_INTERNAL_URL en el environment 'desarrollo'."
            echo "::error::Es la URL interna del backend (p. ej. http://backend:3333/api/v1)."
            exit 1
          fi
          {
            printf 'BACKEND_INTERNAL_URL=%s\n' "$BACKEND_INTERNAL_URL"
          } > /tmp/frontend.env
          base64 -w0 /tmp/frontend.env | ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "base64 -d > '${{ secrets.ORG_PATH }}/dolynation-tonatiuh-front/.env'"

      - name: Desplegar (pull + restart + healthcheck)
        id: deploy_step
        run: |
          set -euo pipefail
          # El agente SSH se creo en el paso anterior, en otro shell: hay que
          # volver a cargarlo aqui para que `ssh` pueda usar la llave cifrada.
          if [ -f ~/.ssh/agent_env ]; then
            . ~/.ssh/agent_env
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
          fi
          ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "bash '${{ secrets.ORG_PATH }}/dolynation-tlalli-infra/scripts/deploy-dev-front.sh'"
        # El estado del job lo necesita el paso que reporta el deployment.

      - name: Reportar el deployment como 'success'
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          DEPLOY_OUTCOME: ${{ steps.deploy_step.outcome }}
        with:
          script: |
            if (!process.env.DEPLOYMENT_ID) {
              core.info('No hay deployment que reportar.');
              return;
            }
            // El estado final refleja el resultado del job: si el healthcheck
            // fallo, el deployment queda en 'failure' y GitHub lo muestra.
            // El paso de deploy es el que decide si el stack levanto:
            // si fallo, su outcome es 'failure'.
            const failed = process.env.DEPLOY_OUTCOME !== 'success';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: failed ? 'failure' : 'success',
              description: failed
                ? 'El deploy fallo: ver el log del job.'
                : 'Deploy correcto: el healthcheck respondio.',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            core.info(`Deployment ${process.env.DEPLOYMENT_ID}: ${failed ? 'failure' : 'success'}`);
