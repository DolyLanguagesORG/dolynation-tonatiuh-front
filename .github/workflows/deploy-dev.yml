name: deploy-dev

# Despliega el frontend al entorno de desarrollo al mergear a `develop`.
# Regenera el `.env` del servidor desde los secretos del environment
# `desarrollo` y luego ejecuta el script de deploy (versionado en el repo
# `infra`). Para agregar una variable nueva: crea el secret y añade una línea
# en el bloque de abajo.
#
# El `.env` solo lleva `BACKEND_INTERNAL_URL`, que es una variable **de
# servidor**: la consume el proxy de Next.js (`src/app/api/v1/[...path]/route.ts`)
# y nunca se compila en el bundle del navegador. Por eso el navegador nunca ve
# la dirección del backend.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  # GitHub actualiza el estado del deployment automaticamente; sin este
  # permiso el GITHUB_TOKEN es de solo lectura y no puede reportarlo.
  deployments: write

concurrency:
  group: deploy-dev-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar frontend en desarrollo
    runs-on: ubuntu-latest
    environment: desarrollo
    # Un push hecho por el propio bot no debe re-disparar el deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.pusher.name != 'github-actions[bot]'
    steps:
      - name: Instalar llave SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_PASSPHRASE: ${{ secrets.DEPLOY_SSH_KEY_PASSPHRASE }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          # El agente SSH se creo en el paso anterior, en otro shell: hay que
          # volver a cargarlo aqui para que `ssh` pueda usar la llave cifrada.
          if [ -f ~/.ssh/agent_env ]; then
            . ~/.ssh/agent_env
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
          fi

          if [ -z "${DEPLOY_SSH_KEY:-}" ] || [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_PORT:-}" ]; then
            echo "::error::Faltan secrets de despliegue (DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_PORT) en el environment 'desarrollo'."
            exit 1
          fi

          mkdir -p ~/.ssh
          # La llave es PEM y puede traer CRLF: se normaliza a LF.
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # La llave tiene passphrase y el runner no es interactivo, asi que
          # ssh-add necesita un askpass que se la entregue.
          #
          # El agente y el askpass se dejan en ~/.ssh porque **cada paso del
          # workflow corre en un shell nuevo**: lo que se exporta aqui no llega
          # al paso siguiente. Los pasos que usan `ssh` vuelven a cargarlos con
          # `. ~/.ssh/agent_env`.
          if [ -n "${DEPLOY_SSH_KEY_PASSPHRASE:-}" ]; then
            printf '%s\n' "$DEPLOY_SSH_KEY_PASSPHRASE" > ~/.ssh/deploy_passphrase
            chmod 600 ~/.ssh/deploy_passphrase
            printf '%s\n' '#!/usr/bin/env bash' 'cat ~/.ssh/deploy_passphrase' > ~/.ssh/askpass.sh
            chmod 700 ~/.ssh/askpass.sh
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
            # ssh-agent -s imprime tambien un "echo Agent pid ..." que no es un
            # comando valido como script: se filtran solo los export.
            ssh-agent -s | grep '^SSH_AUTH_SOCK\|^SSH_AGENT_PID' > ~/.ssh/agent_env
            . ~/.ssh/agent_env
            if ! ssh-add ~/.ssh/deploy_key; then
              echo "::error::No se pudo cargar la llave en el agente SSH. Revisa DEPLOY_SSH_KEY_PASSPHRASE."
              exit 1
            fi
            echo "Llave cargada en el agente SSH."
          fi

          # La clave del host se fija por fingerprint: no se acepta la primera
          # conexion a ciegas. Si el host cambia, hay que actualizar el secret.
          # La clave del host ya no se acepta "a ciegas": se compara con la
          # que esta en el secret DEPLOY_HOST_KEY. Si no coincide (el host
          # cambio o hay un intermediario), el deploy se detiene.
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > /tmp/host_keys 2>&1 || true
          if [ -n "${DEPLOY_HOST_KEY:-}" ]; then
            if ! grep -qF "$DEPLOY_HOST_KEY" /tmp/host_keys; then
              echo "::error::La clave del host no coincide con DEPLOY_HOST_KEY."
              echo "::error::Si el host cambio de verdad, actualiza el secret antes de desplegar."
              exit 1
            fi
          fi
          if [ ! -s /tmp/host_keys ]; then
            echo "::error::No se pudo obtener la clave del host $DEPLOY_HOST:$DEPLOY_PORT."
            echo "::error::Detalle del escaneo:"
            cat /tmp/host_keys
            exit 1
          fi
          cat /tmp/host_keys >> ~/.ssh/known_hosts

      # Sin checkout, el paso siguiente no puede leer el `package.json` del
      # repo (ni `git rev-parse`): la version de respaldo no existiria.
      - name: Checkout del frontend
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Regenerar .env del frontend en el servidor
        env:
          BACKEND_INTERNAL_URL: ${{ secrets.BACKEND_INTERNAL_URL }}
          NEXT_ALLOWED_DEV_ORIGINS: ${{ vars.NEXT_ALLOWED_DEV_ORIGINS }}
        run: |
          set -euo pipefail
          # El agente SSH se creo en el paso anterior, en otro shell: hay que
          # volver a cargarlo aqui para que `ssh` pueda usar la llave cifrada.
          if [ -f ~/.ssh/agent_env ]; then
            . ~/.ssh/agent_env
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
          fi
          if [ -z "${BACKEND_INTERNAL_URL:-}" ]; then
            echo "::error::Falta BACKEND_INTERNAL_URL en el environment 'desarrollo'."
            echo "::error::Es la URL interna del backend (p. ej. http://backend:3333/api/v1)."
            exit 1
          fi
          # El dev server de Next 16 bloquea los recursos cross-site (incluido
          # el websocket de HMR) si el `Origin` no esta en `allowedDevOrigins`.
          # Como el host publico se cambia por variable, el dominio puede
          # cambiar sin tocar codigo.
          if [ -z "${NEXT_ALLOWED_DEV_ORIGINS:-}" ]; then
            echo "::error::Falta NEXT_ALLOWED_DEV_ORIGINS en el environment 'desarrollo'."
            echo "::error::Es el host publico del frontend de desarrollo (admite comodines:"
            echo "::error::'**.yacaterkos.tech'), separado por comas si hay varios."
            exit 1
          fi
          # La version de la APLICACION (la que compone `versions.yml`, el
          # maximo entre backend y frontend). Sin ella, el dev server
          # responde `0.0.0-dev` en `/version` y el badge del pie no dice que
          # build se esta probando.
          # La version de la APLICACION (la que compone `versions.yml`, el
          # maximo entre backend y frontend).
          #
          # Se lee del manifiesto **sin autenticar** (raw.githubusercontent): el
          # token del workflow es de instalacion y **no puede leer** el repo
          # de infra, y las peticiones sin autenticar a raw se limitan por
          # cuota. Por eso va con respaldo: si el manifiesto no esta
          # disponible, se usa la version del paquete de este repo, que
          # siempre se puede leer (para eso el checkout de arriba).
          APP_VERSION="$(curl -fsSL \
            "https://raw.githubusercontent.com/DolyLanguagesORG/dolynation-tlalli-infra/develop/versions.yml" \
            2>/dev/null \
            | grep -E '^app_version:' \
            | head -1 \
            | cut -d: -f2 \
            | tr -d ' \042\047' || true)"
          if [ -z "$APP_VERSION" ]; then
            # Sin manifiesto se usa la version del paquete: mejor eso que
            # `0.0.0-dev`, que no dice nada.
            echo "::warning::No se pudo leer app_version del manifiesto: se usa la version del paquete."
            APP_VERSION="$(node -p "require('./package.json').version" 2>/dev/null || echo '')"
          fi
          # El SHA del commit desplegado: `github.sha`, no `git rev-parse`
          # (este paso no hace checkout del repo y el comando fallaria).
          GIT_COMMIT="${{ github.sha }}"
          {
            printf 'BACKEND_INTERNAL_URL=%s\n' "$BACKEND_INTERNAL_URL"
            printf 'NEXT_ALLOWED_DEV_ORIGINS=%s\n' "$NEXT_ALLOWED_DEV_ORIGINS"
            printf 'APP_VERSION=%s\n' "$APP_VERSION"
            printf 'NEXT_PUBLIC_APP_VERSION=%s\n' "$APP_VERSION"
            printf 'GIT_COMMIT=%s\n' "$GIT_COMMIT"
          } > /tmp/frontend.env
          base64 -w0 /tmp/frontend.env | ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "umask 077 && base64 -d > '${{ secrets.ORG_PATH }}/dolynation-tonatiuh-front/.env'"

      - name: Desplegar (pull + restart + healthcheck)
        run: |
          set -euo pipefail
          # El agente SSH se creo en el paso anterior, en otro shell: hay que
          # volver a cargarlo aqui para que `ssh` pueda usar la llave cifrada.
          if [ -f ~/.ssh/agent_env ]; then
            . ~/.ssh/agent_env
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
          fi
          ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "bash '${{ secrets.ORG_PATH }}/dolynation-tlalli-infra/scripts/deploy-dev-front.sh'"

