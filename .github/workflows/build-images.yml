name: build-images

# Construye la imagen del servicio y la publica en GHCR.
#
# Cada arquitectura (`linux/amd64` y `linux/arm64`) se construye en su propio
# runner nativo (sin QEMU, para evitar bloqueos en `npm ci`) y al final se
# combinan los digests en un manifiesto OCI multi-arquitectura.
#
# Reglas de las etiquetas:
#
#   - **SHA del commit**: siempre. Es inmutable: es lo que se despliega en
#     rehearsal, staging y produccion, y lo que permite volver atras
#     (rollback) con un comando.
#   - **version**: solo cuando la build corresponde a una release concreta
#     (un tag `vX.Y.Z` o un tag pedido a mano). La etiqueta por version es
#     comoda para leer, pero NO se usa para desplegar: si se moviera, el
#     rollback dejaria de ser exacto.
#   - **latest**: solo en `develop`, como puntero al estado actual.
#
# El deploy NUNCA compila en el servidor: compila aqui, una vez, y el
# servidor solo descarga el artefacto. Si dos maquinas compilaran el mismo
# commit, no serian el mismo binario.
#
# Ver operations/FLUJO-DE-RELEASE.md.

on:
  push:
    branches:
      - develop
      # La rama rc-<version> es la que se promueve a staging.
      - 'rc-*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a construir (vacio = el del commit actual)'
        required: false
        type: string

permissions:
  contents: read
  # `packages: write` es lo que permite publicar la imagen en GHCR. Sin este
  # permiso el push falla con "denied".
  packages: write

concurrency:
  group: build-images-${{ github.repository }}
  # No se cancela: una imagen a medio publicar es peor que una que tarda.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # `github.repository` es el nombre del repo. Ojo: `github.event.repository`
  # es un OBJETO y hacia fallar todo el workflow al validarlo.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    name: Preparar metadatos de build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.prepare.outputs.ref }}
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
      built_at: ${{ steps.meta.outputs.built_at }}
      tag_list: ${{ steps.meta.outputs.tag_list }}
    steps:
      - name: Decidir que se construye
        id: prepare
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          CHECKOUT_REF="$REF"
          VERSION=""

          # Si se dispara por un tag vX.Y.Z, ese es el commit y esa la version.
          if [ "$EVENT" = "push" ] && [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${REF#refs/tags/v}"
          fi

          # Si se dispara a mano con un tag, se construye ese tag.
          if [ -n "$INPUT_TAG" ]; then
            VERSION="${INPUT_TAG#v}"
            CHECKOUT_REF="v${VERSION}"
          fi

          # Sin tag (push a develop o a una rc) la version sale del manifiesto
          # del proyecto, en la fila de ESTE repositorio. Sin esto, la
          # APP_VERSION de la imagen quedaba vacia: el build de la rama
          # sobrescribia la imagen del tag (mismo SHA) sin la version, y el
          # endpoint /version reportaba appVersion "".
          if [ -z "$VERSION" ]; then
            MANIFEST="https://raw.githubusercontent.com/DolyLanguagesORG/dolynation-tlalli-infra/develop/versions.yml"
            REPO_NAME="${REPOSITORY##*/}"
            VERSION="$(curl -fsSL "$MANIFEST" 2>/dev/null | awk -v repo="$REPO_NAME" '
              $1 == repo ":" { in_repo = 1; next }
              in_repo && /^[a-z]/ { in_repo = 0 }
              in_repo && $1 == "version:" { gsub(/^[ \t]+|[ \t]+$/, "", $2); print $2; exit }
            ' || true)"
            VERSION="${VERSION:-0.0.0-dev}"
            echo "Sin tag: la version sale del manifiesto ($VERSION)."
          fi

          echo "ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.prepare.outputs.ref }}

      - name: Calcular las etiquetas
        id: meta
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail

          SHA="$(git rev-parse HEAD)"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"

          if [ -n "$VERSION" ]; then
            tag_list="${IMAGE}:${SHA} ${IMAGE}:${VERSION}"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            tag_list="${IMAGE}:${SHA} ${IMAGE}:latest"
          else
            tag_list="${IMAGE}:${SHA}"
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "built_at=$BUILT_AT" >> "$GITHUB_OUTPUT"
          echo "tag_list=$tag_list" >> "$GITHUB_OUTPUT"

          echo "sha=$SHA"
          echo "version=$VERSION"
          echo "image=$IMAGE"
          echo "built_at=$BUILT_AT"
          echo "tag_list=$tag_list"

  build:
    name: Construir imagen (${{ matrix.arch }})
    needs: prepare
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Autenticar en GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          # Se autentica con el PAT, no con el GITHUB_TOKEN: los paquetes de
          # GHCR de la organizacion no estan vinculados a los repos, y el
          # GITHUB_TOKEN de un repo no puede empujar a un paquete sin vinculo
          # (falla con "denied: read_package").
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Construir y publicar por digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            GIT_COMMIT=${{ needs.prepare.outputs.sha }}
            APP_VERSION=${{ needs.prepare.outputs.version }}
            COMPONENT=${{ github.repository }}
            BUILT_AT=${{ needs.prepare.outputs.built_at }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

      - name: Exportar digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${DIGEST#sha256:}"
          if [ -z "$digest" ]; then
            echo "::error::No se recibio digest del build."
            exit 1
          fi
          touch "/tmp/digests/${digest}"

      - name: Subir digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publicar manifiesto multi-arquitectura
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      image: ${{ needs.prepare.outputs.image }}
    steps:
      - name: Descargar digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Autenticar en GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Crear manifiesto multi-arquitectura
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          SHA: ${{ needs.prepare.outputs.sha }}
          TAG_LIST: ${{ needs.prepare.outputs.tag_list }}
        run: |
          set -euo pipefail
          tag_args=()
          for t in $TAG_LIST; do
            tag_args+=(-t "$t")
          done
          sources=()
          for f in /tmp/digests/*; do
            [ -e "$f" ] || continue
            digest="$(basename "$f")"
            sources+=("${IMAGE}@sha256:${digest}")
          done
          if [ "${#sources[@]}" -lt 2 ]; then
            echo "::error::Se esperaban 2 digests (amd64 y arm64), se encontraron ${#sources[@]}."
            exit 1
          fi
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:${SHA}"

      - name: Resumir
        run: |
          {
            echo "### Imagen publicada"
            echo ""
            echo "- \`${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.sha }}\`"
            echo "- version: \`${{ needs.prepare.outputs.version }}\`"
            echo "- commit: \`${{ needs.prepare.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
