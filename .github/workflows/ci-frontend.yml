name: frontend

on:
  # Sin filtro de `paths`: la protección de ramas exige estos checks en
  # todos los PRs, y si un workflow no se dispara su check nunca reporta
  # y el PR queda bloqueado indefinidamente. El repo es público, así que
  # los minutos de Actions son gratuitos.
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `actionlint` NO es una action de GitHub (no trae action.yaml) y las
      # imagenes de Docker Hub estan bloqueadas para Actions, asi que se
      # instala el binario con el script oficial del proyecto.
      - name: Instalar actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          chmod +x actionlint

      # Valida la SINTAXIS de los workflows, que es mas estricta que YAML:
      # claves duplicadas (GitHub rechaza el workflow entero y el run nace
      # sin jobs), expresiones invalidas, `uses:` sin version, etc.
      # `-shellcheck=` desactiva la integracion con shellcheck: aqui importa la
      # sintaxis, no el estilo de los scripts.
      - name: Validar los workflows del repo
        run: ./actionlint -color -shellcheck= .github/workflows/*.yml


  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test del regex de pr-labels
        run: node .github/workflows/pr-labels.regex.test.cjs

      - name: Test del versionado
        run: node scripts/version.test.mjs

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Las unitarias (jest) corren aqui: antes no se ejecutaban en ningun job
      # y una suite en rojo podia mergearse sin que nadie lo notara.
      - name: Unit tests
        run: npm test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Playwright necesita el navegador: `npm ci` no lo baja.
      - name: Instalar el navegador de Playwright
        run: npx playwright install --with-deps chromium

      # El `webServer` del `playwright.config.ts` levanta `next dev` solo.
      # Las pruebas de la suite `live-backend` (que pegan contra el backend
      # desplegado) quedan fuera: `E2E_TARGET` no se define, asi que
      # `live-backend.spec.ts` se ignora.
      - name: E2E tests
        run: npm run test:e2e

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
