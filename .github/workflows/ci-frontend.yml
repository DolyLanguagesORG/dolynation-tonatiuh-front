name: frontend

on:
  # Sin filtro de `paths`: la protección de ramas exige estos checks en
  # todos los PRs, y si un workflow no se dispara su check nunca reporta
  # y el PR queda bloqueado indefinidamente. El repo es público, así que
  # los minutos de Actions son gratuitos.
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    steps:
      # actionlint valida la SINTAXIS de los workflows, que es mas estricta que
      # YAML: detecta claves duplicadas (GitHub rechaza el workflow entero y
      # el run nace sin jobs), expresiones invalidas, `uses:` sin version, etc.
      - uses: actions/checkout@v4

      - name: Validar los workflows del repo
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color .github/workflows/*.yml
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test del regex de pr-labels
        run: node .github/workflows/pr-labels.regex.test.cjs

      - name: Test del versionado
        run: node scripts/version.test.mjs

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
